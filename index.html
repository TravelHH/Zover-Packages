<style>:root{--p:#4B2D8E;--pl:#EFEAFB;--o:#F97A30;--y:#FBC42E;--bg:#F4F2F9;--bd:#E3DDF1;--tx:#1d1830;--mut:#6d6585;--rd:#D64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Outfit','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--tx);direction:rtl;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
.hd{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,#3b2172,var(--p) 55%,#5a37a8);color:#fff}
.hd .hin{display:flex;align-items:center;gap:10px;padding:9px 14px;max-width:1240px;margin:auto}
.hd .lg{background:#fff;border-radius:11px;padding:3px 7px;height:42px;display:flex;align-items:center}
.hd .lg img{height:34px}
.hd .tt{flex:1;min-width:0;font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:11px;height:40px;padding:0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.rbw{height:4px;background:linear-gradient(90deg,#E53935,#F97A30,#FBC42E,#43A047,#1E88E5,#4B2D8E)}
.lay{max-width:1240px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:18px;padding:16px 14px 110px;align-items:start}
.pvcol{position:sticky;top:76px;min-width:0}
.pvbox{background:#E7E2F1;border-radius:18px;padding:14px;display:flex;justify-content:center;overflow:hidden;min-width:0}
.pvw{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 10px 30px rgba(30,15,70,.25);direction:ltr;flex:none}
.pvw .pst{transform-origin:0 0;position:absolute;top:0;left:0}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{border:0;background:var(--p);color:#fff;border-radius:13px;height:48px;padding:0 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:15px;flex:1}
.btn.o{background:var(--o)}.btn.gh{background:var(--pl);color:var(--p)}.btn.wa{background:#1fae54}
.btn.sm{height:38px;font-size:14px;padding:0 12px;flex:none;border-radius:10px}
.btn.rd{background:#FDECEC;color:var(--rd)}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:15px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:16px;font-weight:800;color:var(--p);display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.fl{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}
.fl>span{font-size:12.5px;color:var(--mut);font-weight:700}
.in{width:100%;height:46px;border:1.5px solid var(--bd);border-radius:12px;padding:0 12px;background:#FCFBFE;outline:none}
.in:focus{border-color:#7a5bd0;background:#fff;box-shadow:0 0 0 3px rgba(106,75,196,.12)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tpl{border:2px solid var(--bd);background:#fff;border-radius:14px;padding:8px 6px;cursor:pointer;text-align:center;font-weight:800;font-size:13px;color:var(--mut)}
.tpl .ic{display:block;height:58px;border-radius:9px;margin-bottom:6px;background:linear-gradient(140deg,#6a3fc2,#24104f);position:relative;overflow:hidden}
.tpl.on{border-color:var(--o);color:var(--p);box-shadow:0 0 0 3px rgba(249,122,48,.15)}
.seg{display:flex;background:var(--pl);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;height:38px;font-weight:800;color:var(--p);cursor:pointer;font-size:14px}
.seg button.on{background:var(--p);color:#fff}
.ths{display:flex;gap:10px}
.th{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--bd);cursor:pointer}
.th.on{box-shadow:0 0 0 3px var(--o)}
.stp{display:flex;align-items:center;border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;height:46px;background:#fff}
.stp button{width:46px;height:100%;border:0;background:var(--pl);color:var(--p);font-size:22px;font-weight:800;cursor:pointer}
.stp input{flex:1;min-width:0;border:0;text-align:center;font-weight:800;height:100%;outline:none;width:40px}
.phs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--pl)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer}
.ph .m{position:absolute;bottom:4px;right:4px;border:0;border-radius:8px;background:rgba(255,255,255,.9);color:var(--p);font-size:11px;font-weight:800;padding:3px 6px;cursor:pointer}
.ph .m.on{background:var(--o);color:#fff}
.ph.add{display:grid;place-items:center;border:2px dashed #c9bfe4;color:var(--p);font-weight:800;cursor:pointer;font-size:13px;text-align:center;background:#fff}
.prow{background:#FAF8FE;border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px}
.prow .top{display:grid;grid-template-columns:1.4fr .8fr .8fr auto;gap:8px;align-items:center}
.prow .in{height:44px}
.prow .am{font-family:'Outfit';font-weight:800;font-size:18px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{border:1.5px dashed #c9bfe4;background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--p);cursor:pointer}
.chip.on{border-style:solid;background:var(--pl)}
.irow{display:flex;gap:6px;margin-bottom:7px}
.irow .in{height:42px}
.irow .btn{height:42px;width:42px;padding:0}
.hint{font-size:12.5px;color:var(--mut);margin:-4px 0 10px}
.mdl{position:fixed;inset:0;background:rgba(20,10,45,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.mdl.on{display:flex}
.mdl .box{background:#fff;border-radius:20px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.mdl .mh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:800;color:var(--p);font-size:17px}
.mdl .mh span{flex:1}
.mdl .mb{padding:14px 16px;overflow:auto}
.ofs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.of{border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff}
.of img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--pl)}
.of b{display:block;padding:7px 9px 2px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.of .r{display:flex;gap:5px;padding:6px 8px 9px}
.of .r button{flex:1;height:32px;border:0;border-radius:8px;background:var(--pl);color:var(--p);font-weight:800;cursor:pointer;font-size:12.5px}
.of .r button.d{background:#FDECEC;color:var(--rd);flex:none;width:32px}
.empty{text-align:center;color:var(--mut);padding:24px;border:2px dashed var(--bd);border-radius:14px;font-weight:700}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#1d1830;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-weight:800;color:var(--p)}
.busy.on{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--pl);border-top-color:var(--o);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mbar{display:none}
@media (max-width:900px){
 .lay{grid-template-columns:minmax(0,1fr);padding:10px 10px 100px}
 .pvcol{position:relative;top:0}
 .pvbox{padding:10px}
 .acts{display:none}
 .mbar{display:flex;gap:8px;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(40,20,90,.14)}
 .ib .lb{display:none}
}
/* ---- studio additions ---- */
.lay{grid-template-columns:minmax(0,1fr) 480px}
.outs{display:flex;gap:6px;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:5px;margin-bottom:10px}
.outs button{flex:1;border:0;background:transparent;border-radius:10px;height:42px;font-weight:800;color:var(--mut);cursor:pointer;font-size:14px;white-space:nowrap}
.outs button.on{background:var(--p);color:#fff}
#pv{display:flex;flex-direction:column;align-items:center;gap:14px;background:#E7E2F1;border-radius:18px;padding:14px;max-height:calc(100vh - 210px);overflow:auto}

.zv.pg.pcity .big{position:absolute;top:96px;left:32px;right:32px;height:380px;border-radius:26px;overflow:hidden}
.zv.pg.pcity .big .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(20,8,50,.85))}
.zv.pg.pcity .big .t{position:absolute;right:26px;bottom:20px;left:26px;color:#fff;z-index:2;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.zv.pg.pcity .big h2{margin:0;font-size:52px;font-weight:900;line-height:1}
.zv.pg.pcity .stop{position:absolute;top:16px;right:16px;z-index:3;background:var(--o);color:#fff;border-radius:99px;padding:5px 14px;font-weight:900;font-size:15px}
.zv.pg.pcity .row3{position:absolute;top:490px;left:32px;right:32px;height:170px;display:flex;gap:12px}
.zv.pg.pcity .row3 div{flex:1;position:relative;border-radius:18px;overflow:hidden;background:#eee}
.zv.pg.pcity .sp{position:absolute;top:678px;left:32px;right:32px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.zv.pg.pcity .sp div{background:#F6F3FC;border-radius:12px;padding:8px 10px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:7px;color:var(--p)}
.zv.pg.pcity .sp .ck{width:18px;height:18px}
.zv.pg.pcity .days{position:absolute;top:740px;left:32px;right:32px;bottom:70px;overflow:hidden}
.zv.pg .stt{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;color:var(--p);margin-bottom:6px}
.zv.pg .stt:before{content:'';width:6px;height:20px;border-radius:3px;background:var(--o)}
.zv.pg .dd{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed #E3DDF1;align-items:center}
.zv.pg .dd i{flex:none;width:38px;height:38px;border-radius:11px;background:var(--p);color:#fff;font-style:normal;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.zv.pg .dd i small{font-size:8px;opacity:.8}.zv.pg .dd i b{font-family:'Outfit';font-size:16px}
.zv.pg .dd span{font-size:13px;font-weight:600;line-height:1.35}
.zv.pg .dd span em{font-style:normal;color:var(--o);font-weight:800;font-size:11.5px;display:block}
/* final page */
.zv.pg.pfin .bd{position:absolute;top:96px;left:32px;right:32px;bottom:70px;display:flex;flex-direction:column;gap:14px}
.zv.pg.pfin .pcs{gap:10px}
.zv.pg.pfin .pc{border-radius:18px;padding:10px}
.zv.pg.pfin .pc .am b{font-size:42px}.zv.pg.pfin .pc .am small{font-size:18px}.zv.pg.pfin .pc .lb{font-size:14px}
.zv.pg.pfin .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zv.pg.pfin .bx{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.zv.pg.pfin .bx.g{background:#F1FAF5}.zv.pg.pfin .bx.r{background:#FDF4F4}
.zv.pg.pfin .bx h5{margin:0 0 2px;font-size:15px;font-weight:900}
.zv.pg.pfin .bx.g h5{color:#15835a}.zv.pg.pfin .bx.r h5{color:#c03a3a}
.zv.pg.pfin .bx .li{font-size:13px;gap:8px;font-weight:600}
.zv.pg.pfin .bx .ck{width:18px;height:18px}
.zv.pg.pfin .bx.r .ck{background:#D64545}
.zv.pg.pfin .bx.g .ck{background:#1E9E6A}
.zv.pg.pfin .terms .li{font-size:12.5px;font-weight:600;gap:8px}.zv.pg.pfin .terms .ck{width:16px;height:16px;background:var(--p)}
.zv.pg.pfin .terms{display:flex;flex-direction:column;gap:6px}
.zv.pg.pfin .cbox{margin-top:auto;border-radius:22px;background:linear-gradient(135deg,#5b38a8,#4B2D8E 55%,#24104f);color:#fff;padding:20px 24px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.zv.pg.pfin .cbox b{display:block;font-size:24px;font-weight:900}
.zv.pg.pfin .cbox .cl{font-family:'Outfit';font-weight:800;font-size:17px;direction:ltr;text-align:right}
.zv.pg.pfin .cbox .cta{margin-inline-start:auto;background:var(--o);border-radius:99px;padding:10px 22px;font-weight:900;font-size:20px;flex:none}

.zv.itin .logo{z-index:6}
.s-st.zv.poster .incl .li{font-size:calc(var(--f,1)*33px)}.s-st.zv.poster .incl h4{font-size:36px}
.s-st.zv.poster .tile .lab{font-size:34px}
.zv.price .incl .li{font-size:calc(var(--f,1)*30px)}
.zv.city .sp div{font-size:calc(var(--f,1)*31px);padding:16px 18px}
.s-st.zv.city .sp{grid-template-columns:1fr}
</style>

const H={
 img:(src,lab)=>src?`<img class="ph" src="${src}">`:`<div class="phx">${esc(lab||'')}</div>`,
 nights:n=>`<b>${n}</b> ${nW(n)}`,days:n=>`<b>${n}</b> ${dW(n)}`,
 tot:()=>O.cities.reduce((a,c)=>a+(+c.n||0),0),
 prices:()=>O.prices.filter(p=>fmtAmt(p.amt)),
 from:()=>{const P=H.prices();if(!P.length)return null;let m=P[0];P.forEach(p=>{if(+digits(p.amt).replace(/[^\d.]/g,'')<+digits(m.amt).replace(/[^\d.]/g,''))m=p});return m},
 incl:()=>O.incl.filter(Boolean),
 excl:()=>O.excl.filter(Boolean),
 cityPh:(c,i)=>c.photos[i]||c.photos[0]||'',

 contacts:()=>{const c=[];if(C.phone)c.push(['ph',C.phone]);if(C.wa&&C.wa!==C.phone)c.push(['wa',C.wa]);if(C.web)c.push(['web',C.web]);return c},
 cityLine:()=>O.cities.map(c=>c.ar).filter(Boolean)
};
function pcards(cls=''){const P=H.prices();if(!P.length)return'';return`<div class="pcs ${cls}">${P.map(p=>`<div class="pc">${+p.stars?`<div class="st">${IC.star(26).repeat(+p.stars)}</div>`:''}<div class="am"><b>${fmtAmt(p.amt)}</b><small>${esc(p.cur)}</small></div>${p.lab?`<div class="lb">${esc(p.lab)}</div>`:''}</div>`).join('')}</div>`}
function lis(arr,ic=IC.ck){return arr.map(x=>`<div class="li"><i class="ck">${ic}</i><span>${esc(x)}</span></div>`).join('')}

 /* ---------- all-in-one poster ---------- */

 city(sz,i,n,c,ci){const r=H.ranges()[ci],ph=c.photos.slice(0,3),m=ph.length>=3?'':ph.length===2?'m2':'m1',multi=O.cities.length>1;
  const sp=(c.spots||[]).filter(Boolean).slice(0,4);
  return{cls:'city',vars:`--mh:${{sq:'52%',pt:'56%',st:'52%'}[sz]}`,html:`<img class="dove" src="${IMG.dove}">

 itin(sz,i,n){const D=O.days.length?O.days:genDays();const rs=H.ranges();

 slides(sz){const L=[];const n=1+O.cities.length+(O.showItin?1:0)+1;let i=1;

 /* ---------- PDF ---------- */

 pdf(){const P=[],n=O.cities.length+2,f=H.from(),c0=O.cities[0]||{photos:[]};const multi=O.cities.length>1;

  const hl=multi?O.cities.flatMap(c=>(c.spots||[]).slice(0,2)).slice(0,6):(c0.spots||[]).slice(0,6);

  const D=O.days.length?O.days:genDays(),rs=H.ranges();

   <div class="row3">${[1,2,3].map(k=>`<div>${H.img(ph[k]||'',c.ar)}</div>`).join('')}</div>
   <div class="sp">${(c.spots||[]).filter(Boolean).slice(0,4).map(s=>`<div><i class="ck">${IC.ck}</i>${esc(s)}</div>`).join('')}</div>
   <div class="days"><div class="stt">البرنامج في ${esc(c.ar)}</div>${D.slice(r[0]-1,r[1]).map((d,k)=>`<div class="dd"><i><small>اليوم</small><b>${r[0]+k}</b></i><span>${esc(d)}</span></div>`).join('')}</div>${this.pf(ci+2,n)}`})});
  const terms=['الأسعار خاضعة للتوافر وقت تأكيد الحجز','الإلغاء والتعديل حسب سياسة شركات الطيران والفنادق','يجب أن يكون جواز السفر ساريًا 6 أشهر على الأقل'].concat(O.notes?[O.notes]:[]);

'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const digits=v=>String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const fmtAmt=v=>{v=digits(v).replace(/[^\d.]/g,'');if(!v)return'';const [a,b]=v.split('.');return Number(a).toLocaleString('en-US')+(b?'.'+b:'')};
const nW=n=>n>=3&&n<=10?'ليالي':'ليلة',dW=n=>n>=3&&n<=10?'أيام':'يوم';

const newOffer=()=>({v:3,id:uid(),theme:'zover',size:'pt',out:'poster',destId:'',sub:'',title:'',cities:[],dates:'',badge:'',
 prices:[{amt:'',cur:'ر.س',lab:'السعر للشخصين',stars:''}],incl:[],excl:EXCL0.slice(),notes:'',showItin:true,days:[],updated:Date.now()});

function genDays(){const D=[],cs=O.cities;if(!cs.length)return D;
 cs.forEach((c,ci)=>{const t=CITIES[c.key],acts=t?t.act:[];let ai=0;const n=Math.max(1,+c.n||1);
  for(let k=0;k<n;k++){
   if(ci===0&&k===0)D.push(t&&t.arr?t.arr[0]:`الوصول إلى ${c.ar} والاستقبال في المطار ثم التوجه إلى الفندق`);
   else if(k===0)D.push(`الانتقال ${(VIA[c.via]||VIA.air)[0]} إلى ${c.ar} وتسجيل الدخول في الفندق`);
   else if(ai<acts.length)D.push(acts[ai++][0]);
   else D.push(`يوم حر للراحة والتسوق في ${c.ar}`)}});
 D.push('تسجيل الخروج والتوجه إلى المطار للمغادرة مع أطيب الأمنيات');return D}

/* ---------- IndexedDB ---------- */
const DB={db:null,open(){return new Promise(r=>{try{const q=indexedDB.open('zover-studio',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 get(k){return new Promise(r=>{if(!this.db)return r(null);const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})},

  wr.innerHTML=`<div class="fr ${O.theme==='zover'?'zv':O.theme} ${f.cls} s-${f.sz}" style="width:${f.w}px;height:${f.h}px;${f.vars||''}">${f.html}</div>${O.out!=='poster'?`<span class="fno">${i+1}</span>`:''}`;

function fit(fr){
 $$('[data-ft]',fr).forEach(el=>{const lines=+el.dataset.ft;let ts=parseFloat(getComputedStyle(el).fontSize);el.style.fontSize='';ts=parseFloat(getComputedStyle(el).fontSize);
  let g=0;while(g++<40&&(el.scrollHeight>ts*1.14*lines+6||el.scrollWidth>el.clientWidth+2)&&ts>30){ts-=3;el.style.fontSize=ts+'px'}});
 $$('[data-fit]',fr).forEach(el=>{let f=1;el.style.setProperty('--f',1);let g=0;while(g++<30&&(el.scrollHeight>el.clientHeight+1)&&f>.55){f-=.04;el.style.setProperty('--f',f.toFixed(2))}})}
function scale(){const pv=$('#pv');const W=pv.clientWidth-4;const mob=innerWidth<=900;
 $$('.fw',pv).forEach(wr=>{const fr=wr.firstElementChild,w=+fr.style.width.replace('px',''),h=+fr.style.height.replace('px','');
  let s=W/w;if(O.out==='poster'){const mh=mob?innerHeight*.6:innerHeight-210;s=Math.min(s,mh/h)}if(O.out==='slides'&&!mob)s=Math.min(s,(innerHeight-210)/h);
  wr.style.width=w*s+'px';wr.style.height=h*s+'px';fr.style.transform=`scale(${s})`})}

const blobOf=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.93));

async function frames(){renderFrames();await new Promise(r=>setTimeout(r,350));await Promise.all($$('#pv img').map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));$$('#pv .fr').forEach(fit);return $$('#pv .fr')}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}
async function buildFiles(kind){const F=await frames();const out=[];
 if(kind==='pdf'){const imgs=[];for(let i=0;i<F.length;i++){busy(true,`جاري تجهيز الصفحة ${i+1} من ${F.length}…`);const c=await capture(F[i],2);imgs.push({b:new Uint8Array(await (await blobOf(c)).arrayBuffer()),w:c.width,h:c.height})}
  out.push(new File([makePdf(imgs)],base()+'.pdf',{type:'application/pdf'}))}
 else for(let i=0;i<F.length;i++){busy(true,F.length>1?`جاري تجهيز الصورة ${i+1} من ${F.length}…`:'جاري تجهيز الصورة…');const c=await capture(F[i],1);out.push(new File([await blobOf(c)],kind==='poster'?`${base()}-${O.size}.jpg`:`${base()}-${String(i+1).padStart(2,'0')}.jpg`,{type:'image/jpeg'}))}
 return out}

function makePdf(imgs){const enc=new TextEncoder(),parts=[];let off=0;const xr=[];const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length};
 const obj=(n,fn)=>{xr[n]=off;push(`${n} 0 obj\n`);fn();push('\nendobj\n')};push('%PDF-1.4\n');const n=imgs.length;
 obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));obj(2,()=>push(`<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${n} >>`));
 imgs.forEach((im,i)=>{const p=3+3*i;obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
  const cs=`q\n595.28 0 0 841.89 0 0 cm\n/Im${i} Do\nQ\n`;obj(p+1,()=>{push(`<< /Length ${cs.length} >>\nstream\n`);push(cs);push('endstream')});
  obj(p+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.b.length} >>\nstream\n`);push(im.b);push('\nendstream')})});
 const xo=off,t=3+3*n;let x=`xref\n0 ${t}\n0000000000 65535 f \n`;for(let k=1;k<t;k++)x+=String(xr[k]).padStart(10,'0')+' 00000 n \n';push(x);push(`trailer\n<< /Size ${t} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
 return new Blob(parts,{type:'application/pdf'})}
async function saveOffer(){busy(true,'جاري الحفظ…');try{const F=await frames();const c=await capture(F[0],.3);const L=await DB.get('offers')||[];
 const rec={id:O.id,title:O.title||'بدون اسم',thumb:c.toDataURL('image/jpeg',.75),updated:Date.now(),data:JSON.parse(JSON.stringify(O))};const i=L.findIndex(x=>x.id===O.id);i>=0?L[i]=rec:L.unshift(rec);
 toast(await DB.set('offers',L)?'💾 تم الحفظ في «عروضي»':'⚠️ الحفظ مش متاح')}catch(e){console.error(e);toast('⚠️ مقدرتش أحفظ')}busy(false)}
